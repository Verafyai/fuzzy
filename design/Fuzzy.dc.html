<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["waiting","sniffing","found","hardened","broken"],"default":"waiting"},"size":{"editor":"int","default":200,"min":16,"max":800},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
renderVals() {
const mood = this.props.mood ?? 'waiting';
const size = this.props.size ?? 200;
return {
size: size,
px: size + 'px',
isWaiting: mood === 'waiting',
isSniffing: mood === 'sniffing',
isFound: mood === 'found',
isHardened: mood === 'hardened',
isBroken: mood === 'broken'
};
}
}
</script>
</body>
</html>
